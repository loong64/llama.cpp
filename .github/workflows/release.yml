name: release

on:
  workflow_dispatch:
  schedule:
    - cron: '0 20 * * *'

env:
  APP_NAME: llama
  REPO_NAME: ggml-org/llama.cpp
  CMAKE_ARGS: "-DLLAMA_BUILD_EXAMPLES=OFF -DLLAMA_BUILD_TESTS=OFF -DLLAMA_BUILD_TOOLS=ON -DLLAMA_BUILD_SERVER=ON -DGGML_RPC=ON"

jobs:
  check:
    runs-on: ubuntu-slim
    outputs:
      APP_BUILD: ${{ steps.check-release.outputs.build }}
      APP_VERSION: ${{ steps.get-version.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v6

      - name: Get Version
        id: get-version
        run: |
          APP_VERSION=$(curl -s "https://api.github.com/repos/${{ env.REPO_NAME }}/releases/latest" | jq -r .tag_name)
          if [ -z "${APP_VERSION}" ] || [ "${APP_VERSION}" == "null" ]; then
            echo "Failed to get version"
            exit 1
          fi
          
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_ENV
          echo "APP_VERSION=${APP_VERSION}" >> $GITHUB_OUTPUT

          echo ""
          echo "========== Build Args =========="
          echo "APP_VERSION=${APP_VERSION}"

      - name: Check Release
        id: check-release
        run: |
          gh release view ${APP_VERSION} -R ${{ github.repository }} | grep ${{ env.APP_NAME }}-.* >/dev/null 2>&1 || echo "build=1" >> $GITHUB_OUTPUT
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  ui:
    runs-on: ubuntu-slim
    needs: check
    if: needs.check.outputs.APP_BUILD == '1'
    env:
      APP_VERSION: ${{ needs.check.outputs.APP_VERSION }}

    steps:
      - name: Checkout code
        uses: actions/checkout@v6
        with:
          repository: ${{ env.REPO_NAME }}
          ref: ${{ env.APP_VERSION }}

      - name: Resolve UI version
        id: version
        run: |
          version="${{ env.APP_VERSION }}"
          if [ -z "$version" ]; then
            version="b$(git rev-list --count HEAD)"
          fi
          echo "ui_version=${version}" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: "24"
          # cache: "npm"
          # cache-dependency-path: "tools/ui/package-lock.json"
          package-manager-cache: false

      - name: Install dependencies
        run: npm ci
        working-directory: tools/ui

      - name: Build application
        env:
          LLAMA_BUILD_NUMBER: ${{ steps.version.outputs.ui_version }}
        run: npm run build
        working-directory: tools/ui

      - name: Run PWA unit tests (versioned build output)
        run: npx vitest --project=unit --run tests/unit/pwa.spec.ts
        working-directory: tools/ui

      - name: Upload built UI
        uses: actions/upload-artifact@v6
        with:
          name: llama-ui.zip
          path: tools/ui/dist/
          retention-days: 1

  build:
    runs-on: ubuntu-latest
    needs: [check, ui]
    if: needs.check.outputs.APP_BUILD == '1'
    env:
      APP_VERSION: ${{ needs.check.outputs.APP_VERSION }}

    steps:
      - uses: actions/checkout@v6

      - name: Setup QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Download UI build
        uses: actions/download-artifact@v7
        with:
          name: llama-ui.zip
          path: tools/ui/dist

      - uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/loong64
          load: true
          push: false
          build-args: |
            VERSION=${{ env.APP_VERSION }}
          tags: |
            ghcr.io/${{ github.repository_owner }}/${{ env.APP_NAME }}:${{ env.APP_VERSION }}
          outputs: type=local,dest=./

      - name: Upload artifacts
        uses: actions/upload-artifact@v7
        with:
          path: dist/
          name: llama-bin-debian-loong64

  release:
    runs-on: ubuntu-slim
    needs: [check, build]
    if: needs.check.outputs.APP_BUILD == '1'
    env:
      APP_VERSION: ${{ needs.check.outputs.APP_VERSION }}
    steps:
      - uses: actions/checkout@v6
      - name: Download artifacts
        uses: actions/download-artifact@v8
        with:
          path: dist
          pattern: llama-bin-*
          merge-multiple: true

      - name: Create release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG_NAME="${{ env.APP_VERSION }}"
          gh release create "${TAG_NAME}" \
            --generate-notes \
            --title "${TAG_NAME}" \
            dist/*
